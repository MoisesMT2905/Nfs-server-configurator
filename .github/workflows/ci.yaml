name: CI

on:
  push:
    branches: [ main, develop, restructure/yast2-module ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint with flake8
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  test:
    name: Test with pytest
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-mock
        pip install -r requirements.txt || true
    
    - name: Run tests with pytest
      run: |
        pytest tests/ -v --cov=src --cov-report=term-missing
    
    - name: Generate coverage report
      if: always()
      run: |
        pytest tests/ --cov=src --cov-report=xml
    
    - name: Upload coverage to artifacts
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: coverage.xml

  integration:
    name: Integration check
    runs-on: ubuntu-latest
    needs: [lint, test]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0
        python -m pip install --upgrade pip
        pip install -r requirements.txt || true
    
    - name: Verify imports
      run: |
        python3 -c "import sys; sys.path.insert(0, '.'); from src.backend.nfs_manager import NFSManager; print('NFSManager imported OK')"
        python3 -c "import sys; sys.path.insert(0, '.'); from src.backend.config_parser import ExportsConfigParser; print('ExportsConfigParser imported OK')"
        python3 -c "import sys; sys.path.insert(0, '.'); from src.utils.validators import NFSValidator; print('NFSValidator imported OK')"
    
    - name: Check packaging files exist
      run: |
        test -f packaging/org.yast2.nfshelper.policy
        test -f packaging/yast2-nfs-helper.service
        test -f packaging/yast2-nfs-server.spec
        echo "All packaging files present"
