name: CI

on:
  push:
    branches:
      - main
      - 'restructure/**'
      - 'copilot/**'
  pull_request:
    branches:
      - main
      - 'restructure/**'

jobs:
  lint:
    name: Lint Python Code
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      
      - name: Run flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings. Line length set to 120.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics \
            --exclude=.git,__pycache__,build,dist,venv,env,.eggs,*.egg-info

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          # Install pydbus if available
          pip install pydbus || echo "pydbus not available from pip"
      
      - name: Run pytest
        run: |
          pytest tests/ -v --cov=src --cov-report=term --cov-report=xml
        env:
          # Prevent GTK warnings in headless environment
          DISPLAY: ':99'
      
      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  integration:
    name: Integration Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0
          python -m pip install --upgrade pip
      
      - name: Check imports
        run: |
          python3 -c "from src.backend.config_parser import ExportsConfigParser, build_export_line; print('config_parser OK')"
          python3 -c "from src.backend.nfs_manager import NFSManager; print('nfs_manager OK')"
          python3 -c "from src.utils.validators import NFSValidator, validate_path, validate_client; print('validators OK')"
          python3 -c "from src.gui.main_window import NFSConfiguratorGUI; print('GUI OK')"
      
      - name: Check helper syntax
        run: |
          python3 -m py_compile src/priv_helper/helper.py
          python3 -m py_compile src/priv_helper/client_example.py
      
      - name: Validate packaging files
        run: |
          # Check that packaging files exist
          test -f packaging/yast2-nfs-helper.service
          test -f packaging/org.yast2.nfshelper.policy
          test -f packaging/yast2-nfs-server.spec
          echo "All packaging files present"
